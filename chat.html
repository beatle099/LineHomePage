<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Haru Tokyo | LINE</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" media="print" onload="this.media='all'" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#06C755;--green-dk:#05a847;--green-lt:#f0faf4;
  --gold:#b8860b;--gold-lt:#fffbeb;
  --blue:#1a6bb5;
  --rose:#c8846a;--rose-lt:#fdf3ef;
  --bg:#ddd5c8;--white:#fff;--text:#111;--muted:#666;--hint:#aaa;
  --border:#e0e0e0;--danger:#dc2626;
  --font:'Noto Sans JP',sans-serif;
  --shadow:0 1px 4px rgba(0,0,0,.1);
}
body{font-family:var(--font);background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

/* ── LINE Header ── */
.line-hdr{background:var(--green);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.hdr-back{color:white;font-size:13px;display:flex;align-items:center;gap:2px;cursor:pointer;min-width:48px;text-decoration:none}
.hdr-back svg{width:16px;height:16px;stroke:white;fill:none;stroke-width:2.5;stroke-linecap:round}
.hdr-center{flex:1;text-align:center}
.hdr-name{color:white;font-size:15px;font-weight:700}
.hdr-sub{color:rgba(255,255,255,.8);font-size:11px;margin-top:1px}
.hdr-icons{display:flex;gap:14px;min-width:48px;justify-content:flex-end}
.hdr-icons svg{width:20px;height:20px;stroke:white;fill:none;stroke-width:1.8;stroke-linecap:round;cursor:pointer}

/* ── Chat scroll area ── */
.chat-area{flex:1;overflow-y:auto;padding:14px 10px 8px;display:flex;flex-direction:column}
.date-pill{text-align:center;margin:4px 0 14px}
.date-pill span{background:rgba(0,0,0,.22);color:white;font-size:11px;padding:3px 12px;border-radius:99px}

/* ── Messages ── */
.msg-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:10px}
.msg-row.user{flex-direction:row-reverse}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#4a3728,#2a1a0e);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.av svg{width:26px;height:26px;stroke:rgba(255,255,255,.7);fill:none;stroke-width:1.5;stroke-linecap:round}
.av img{width:44px;height:44px;object-fit:cover;border-radius:50%}
.msg-col{display:flex;flex-direction:column;max-width:78%}
.msg-row.user .msg-col{align-items:flex-end}
.bubble{background:var(--white);border-radius:4px 16px 16px 16px;padding:10px 13px;font-size:13px;line-height:1.75;box-shadow:var(--shadow)}
.msg-row.user .bubble{background:var(--green);color:white;border-radius:16px 4px 16px 16px}
.msg-time{font-size:10px;color:rgba(0,0,0,.38);margin-top:3px}
.msg-row.user .msg-time{text-align:right}

/* ── Typing ── */
.typing-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:10px}
.typing-bub{background:var(--white);border-radius:4px 16px 16px 16px;padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:5px}
.typing-bub span{width:7px;height:7px;border-radius:50%;background:#bbb;animation:tp .9s infinite}
.typing-bub span:nth-child(2){animation-delay:.2s}
.typing-bub span:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* ── Image card (single) ── */
.img-card{background:var(--white);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);width:220px}
.ic-img{height:130px;display:flex;align-items:center;justify-content:center}
.ic-img.salon{background:linear-gradient(135deg,#ecddd4,#c4a090)}
.ic-img.green{background:linear-gradient(135deg,#c8dfc8,#a0c0a0)}
.ic-img.gold{background:linear-gradient(135deg,#e8d888,#c8a828)}
.ic-img svg{width:48px;height:48px;opacity:.3;stroke:rgba(60,30,10,.6);fill:none;stroke-width:1.5;stroke-linecap:round}
.ic-body{padding:12px 14px}
.ic-title{font-size:13px;font-weight:700;line-height:1.5;margin-bottom:6px}
.ic-desc{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:8px}
.ic-link{color:var(--blue);font-size:13px;font-weight:500;padding:8px 0;border-top:1px solid var(--border);display:block;cursor:pointer;text-align:center}
.ic-link:hover{background:#f5f9ff}

/* ── Carousel ── */
.caro-wrap{margin-left:52px;padding-bottom:4px;max-width:calc(100% - 52px)}
.caro-inner{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0}
.caro-card{background:var(--white);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.caro-img{height:90px;display:flex;align-items:center;justify-content:center}
.caro-img.c1{background:linear-gradient(135deg,#f5ede8,#d4b8a8)}
.caro-img.c2{background:linear-gradient(135deg,#e0f0e4,#b0d4b8)}
.caro-img.c3{background:linear-gradient(135deg,#eae4d8,#c8c0a8)}
.caro-img.c4{background:linear-gradient(135deg,#e0d4ec,#c0b0d4)}
.caro-img.c5{background:linear-gradient(135deg,#d8e8f0,#a8c8d8)}
.caro-img svg{width:36px;height:36px;opacity:.28;stroke:rgba(60,30,10,.7);fill:none;stroke-width:1.5;stroke-linecap:round}
.caro-body{padding:8px 10px}
.caro-title{font-size:11px;font-weight:700;line-height:1.4;margin-bottom:3px}
.caro-desc{font-size:10px;color:var(--muted);line-height:1.4;margin-bottom:6px}
.caro-link{color:var(--blue);font-size:10px;font-weight:500;padding:5px 0;border-top:1px solid var(--border);display:block;cursor:pointer;text-align:center}
.caro-link+.caro-link{border-top:none;padding-top:0}

/* ── Wide 2-col cards ── */
.wide-wrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-left:52px;max-width:calc(100% - 52px);padding:0}
.wide-card{background:var(--white);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.wc-img{height:90px;display:flex;align-items:center;justify-content:center}
.wc-img.spa{background:linear-gradient(135deg,#d8ccc4,#b8a898)}
.wc-img.prod{background:linear-gradient(135deg,#e4dfd4,#c8c4b4)}
.wc-img svg{width:30px;height:30px;opacity:.28;stroke:rgba(60,30,10,.7);fill:none;stroke-width:1.5;stroke-linecap:round}
.wc-body{padding:10px 12px}
.wc-title{font-size:11px;font-weight:700;line-height:1.4;margin-bottom:4px}
.wc-link{color:var(--blue);font-size:10px;font-weight:500;padding:5px 0;border-top:1px solid var(--border);display:block;cursor:pointer}
.wc-link:hover{background:#f5f9ff}

/* ── Booking card ── */
.book-card{background:var(--white);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);width:240px}
.bk-img{height:130px;display:flex;align-items:center;justify-content:center}
.bk-img.warm{background:linear-gradient(135deg,#c8d4c8,#a0b4a0)}
.bk-img svg{width:40px;height:40px;opacity:.28;stroke:rgba(40,60,40,.7);fill:none;stroke-width:1.5;stroke-linecap:round}
.bk-body{padding:12px 14px}
.bk-title{font-size:13px;font-weight:700;margin-bottom:4px}
.bk-desc{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:10px}
.bk-btn{display:block;width:100%;padding:11px;text-align:center;font-size:13px;font-weight:700;border:none;border-radius:6px;cursor:pointer;font-family:var(--font);margin-bottom:8px}
.bk-btn:last-child{margin-bottom:0}
.btn-gold{background:var(--gold);color:white}
.btn-green{background:var(--green);color:white}

/* ── Point card ── */
.point-wrap{background:var(--white);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);width:260px;margin-left:44px;padding:14px}
.pt-title{font-size:13px;font-weight:700;color:var(--gold);text-align:center;margin-bottom:2px}
.pt-sub{font-size:10px;color:var(--muted);text-align:center;margin-bottom:10px}
.pt-logo{width:56px;height:56px;border-radius:50%;border:2px solid #d4a820;background:#fffbeb;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:10px;font-weight:700;color:#92400e;letter-spacing:.5px}
.pt-tagline{font-size:10px;color:#92400e;background:#fffbeb;border-radius:6px;padding:5px 8px;text-align:center;font-weight:500;margin-bottom:10px}
.pt-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pt-btn{background:var(--gold);border-radius:8px;padding:10px 6px;text-align:center;cursor:pointer;transition:opacity .15s}
.pt-btn:active{opacity:.8}
.pt-badge{background:var(--danger);color:white;font-size:9px;padding:2px 5px;border-radius:4px;display:inline-block;margin-bottom:4px}
.pt-btn-sub{font-size:10px;color:rgba(255,255,255,.8);margin-bottom:3px}
.pt-btn-main{font-size:11px;font-weight:700;color:white}

/* ── Access ── */
.access-bub{background:var(--white);border-radius:4px 16px 16px 16px;padding:12px 14px;font-size:13px;line-height:1.8;max-width:78%;box-shadow:var(--shadow)}
.map-link{color:var(--blue);display:block;margin-top:6px;font-size:12px}
.map-preview{background:#f0f0f0;border:1px solid var(--border);border-radius:6px;padding:7px 10px;margin-top:5px;font-size:11px;color:var(--muted)}

/* ── QR ── */
.qr-wrap{background:var(--white);border-radius:12px;padding:18px;text-align:center;box-shadow:var(--shadow);width:240px;margin-left:44px}
.qr-note{font-size:11px;color:var(--muted);line-height:1.7;margin:10px 0}
.lm-badge{display:inline-flex;align-items:center;gap:6px;background:#e6f7ec;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:700;color:#1a6b3a}

/* ── Survey ── */
.survey-wrap{background:var(--white);border-radius:12px;padding:14px;margin:0 10px 10px 54px;box-shadow:var(--shadow)}
.s-q{font-size:13px;font-weight:700;margin-bottom:10px}
.s-opt{width:100%;text-align:left;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--font);font-size:13px;cursor:pointer;background:var(--white);color:var(--text);display:block;margin-bottom:6px;transition:all .15s}
.s-opt:hover,.s-opt.sel{border-color:var(--green);background:var(--green-lt);color:var(--green);font-weight:500}
.age-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.age-num{font-size:22px;font-weight:700;color:var(--green);min-width:52px;text-align:center}
input[type=range]{flex:1;accent-color:var(--green)}
.tick-row{display:flex;justify-content:space-between;font-size:10px;color:var(--hint);margin-bottom:10px}
.concern-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.c-chip{padding:7px 12px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;background:var(--white);font-family:var(--font);transition:all .15s}
.c-chip.sel{background:var(--rose);border-color:var(--rose);color:white}
.s-submit{width:100%;padding:11px;background:var(--green);color:white;border:none;border-radius:8px;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer}

/* ── RICH MENU ── */
.rich-menu{background:white;border-top:1px solid var(--border);flex-shrink:0}
.rm-toggle{width:100%;padding:7px;background:var(--white);border:none;border-top:1px solid var(--border);font-size:11px;color:var(--muted);cursor:pointer;font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:4px}
.rm-toggle svg{width:12px;height:12px;stroke:var(--muted);fill:none;stroke-width:2;transition:transform .2s}
.rm-toggle.open svg{transform:rotate(180deg)}
.rm-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border)}
.rm-btn{padding:14px 6px;text-align:center;cursor:pointer;border-right:1px solid var(--border);border-bottom:1px solid var(--border);transition:background .12s}
.rm-btn:nth-child(3n){border-right:none}
.rm-btn:nth-child(n+4){border-bottom:none}
.rm-btn:active{background:var(--green-lt)}
.rm-icon{width:34px;height:34px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center}
.rm-icon svg{width:18px;height:18px;stroke-width:1.8;stroke-linecap:round;fill:none}
.rm-icon.green{background:var(--green-lt)}
.rm-icon.green svg{stroke:var(--green)}
.rm-icon.gold{background:var(--gold-lt)}
.rm-icon.gold svg{stroke:var(--gold)}
.rm-icon.blue{background:#eff6ff}
.rm-icon.blue svg{stroke:var(--blue)}
.rm-icon.rose{background:var(--rose-lt)}
.rm-icon.rose svg{stroke:var(--rose)}
.rm-icon.gray{background:#f5f5f5}
.rm-icon.gray svg{stroke:#666}
.rm-label{font-size:11px;font-weight:500;color:var(--text)}

/* ── Input bar ── */
.input-bar{background:var(--bg);border-top:1px solid rgba(0,0,0,.1);padding:8px 10px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.input-inner{flex:1;background:var(--white);border-radius:20px;padding:9px 15px;font-size:14px;color:var(--muted);cursor:pointer;border:1px solid var(--border);display:flex;align-items:center}
.input-inner input{width:100%;border:none;outline:none;font-family:var(--font);font-size:14px;background:transparent;color:var(--text)}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;border:none}
.send-btn svg{width:16px;height:16px;stroke:white;fill:none;stroke-width:2.2;stroke-linecap:round}

/* ── Quick reply chips ── */
.qr-chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 10px 10px 54px}
.qr-chip{background:var(--white);border:1.5px solid var(--green);border-radius:99px;padding:8px 14px;font-size:13px;color:var(--green);font-weight:500;cursor:pointer;font-family:var(--font);box-shadow:var(--shadow);transition:all .12s}
.qr-chip:active{background:var(--green);color:white}
</style>
</head>
<body>

<!-- LINE Header -->
<div class="line-hdr">
  <a class="hdr-back" href="index.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    戻る
  </a>
  <div class="hdr-center" style="display:flex;align-items:center;justify-content:center;gap:8px">
    <img src="images/line_icon.png" width="28" height="28" loading="lazy" style="border-radius:50%;object-fit:cover" onerror="this.style.display='none'">
    <div>
      <div class="hdr-name">Haru Tokyo</div>
      <div class="hdr-sub">ヘアサロン · 表参道</div>
    </div>
  </div>
  <div class="hdr-icons">
    <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.6 11.6a19.79 19.79 0 01-3.07-8.67A2 2 0 012.51 1h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 8.52a16 16 0 006.29 6.29l.89-.89a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/><circle cx="5" cy="12" r="1.5"/></svg>
  </div>
</div>

<!-- Chat area -->
<div class="chat-area" id="chat-area">
  <div class="date-pill"><span>今日</span></div>
</div>

<!-- Rich Menu (hidden until survey done) -->
<div class="rich-menu" id="rich-menu" style="display:none">
  <button class="rm-toggle" id="rm-toggle" onclick="toggleRM()">
    <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
    メニュー
  </button>
  <div id="rm-body" style="display:none">
    <div class="rm-grid">
      <div class="rm-btn" onclick="rmAction('stylist')">
        <div class="rm-icon rose"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M6 20c0-4 2.7-7 6-7s6 3 6 7"/></svg></div>
        <div class="rm-label">スタイリスト</div>
      </div>
      <div class="rm-btn" onclick="rmAction('style_menu')">
        <div class="rm-icon blue"><svg viewBox="0 0 24 24"><path d="M12 3C8 3 4 7 4 12c0 4 2.7 7.5 6 9M12 3c4 0 8 4 8 9 0 4-2.7 7.5-6 9M12 3v18M4 12h16"/></svg></div>
        <div class="rm-label">スタイルメニュー</div>
      </div>
      <div class="rm-btn" onclick="rmAction('reservation')">
        <div class="rm-icon green"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div>
        <div class="rm-label">予約する</div>
      </div>
      <div class="rm-btn" onclick="rmAction('point')">
        <div class="rm-icon gold"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 3"/></svg></div>
        <div class="rm-label">ポイント</div>
      </div>
      <div class="rm-btn" onclick="rmAction('access')">
        <div class="rm-icon gray"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
        <div class="rm-label">アクセス</div>
      </div>
      <div class="rm-btn" onclick="rmAction('campaign')">
        <div class="rm-icon rose"><svg viewBox="0 0 24 24"><path d="M20 12V22H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/></svg></div>
        <div class="rm-label">キャンペーン</div>
      </div>
    </div>
  </div>
</div>

<!-- Input bar -->
<div class="input-bar" id="input-bar">
  <div class="input-inner" onclick="focusInput(this)">
    <input type="text" id="msg-input" placeholder="メッセージを入力" onkeydown="if(event.key==='Enter')sendMsg()">
  </div>
  <button class="send-btn" onclick="sendMsg()">
    <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2" fill="white" stroke="none"/></svg>
  </button>
</div>

<script>
const IMAGE_MAP = {
  'koshigaya': 'images/stylist_koshigaya.png',
  'okuyama': 'images/stylist_okuyama.png',
  'sato': 'images/stylist_sato.png',
  'manabe': 'images/stylist_manabe.png',
  'any_stylist': 'images/stylist_all.png',
  'cut_large': 'images/menu_cut.png',
  'color_large': 'images/menu_color.png',
  'perm': 'images/menu_perm.png',
  'treatment': 'images/menu_treatment.png',
  'stylist': 'images/menu_consult.png',
  'coupon': 'images/coupon_bg.png',
  'spa': 'images/coupon_bg.png',
  'gift_unlock': 'images/gift_bg.png',
  'welcome': 'images/gift_bg.png',
  'salon_intro': 'images/gift_bg.png',
  'salon_interior': 'images/salon_interior.png',
  'products': 'images/products_shelf.png',
  'booking': 'images/booking_hero.png',
  'point': 'images/rm_point.png',
  'access': 'images/rm_access.png',

// UTILS

const area = document.getElementById('chat-area');
const now = new Date();
function timeStr(){ const d=new Date(),h=d.getHours(),ampm=h<12?'午前':'午後'; return `${ampm} ${String(h%12||12).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
let _scrollTimer=null;
function scroll(){ if(_scrollTimer) clearTimeout(_scrollTimer); _scrollTimer=setTimeout(()=>{_scrollTimer=null;area.scrollTo({top:area.scrollHeight,behavior:'smooth'});},120); }

function av(){
  const d=document.createElement('div');d.className='av';
  const img=document.createElement('img');
  img.src='images/bot_avatar.png';
  img.width=44;img.height=44;img.loading='lazy';
  img.onerror=function(){
    d.removeChild(img);
    d.innerHTML=`<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>`;
  };
  d.appendChild(img);
  return d;
}

let typingEl=null;
function showTyping(){
  const row=document.createElement('div');row.className='typing-row';row.id='typing';
  row.appendChild(av());
  const b=document.createElement('div');b.className='typing-bub';
  b.innerHTML='<span></span><span></span><span></span>';
  row.appendChild(b);area.appendChild(row);scroll();typingEl=row;
}
function hideTyping(){if(typingEl){typingEl.remove();typingEl=null;}const t=document.getElementById('typing');if(t)t.remove();}

function botMsg(html,delay=650){
  return new Promise(res=>{
    showTyping();
    setTimeout(()=>{
      hideTyping();
      const row=document.createElement('div');row.className='msg-row';
      row.appendChild(av());
      const col=document.createElement('div');col.className='msg-col';
      const bub=document.createElement('div');bub.className='bubble';bub.innerHTML=html;
      const ts=document.createElement('div');ts.className='msg-time';ts.textContent=timeStr();
      col.appendChild(bub);col.appendChild(ts);row.appendChild(col);area.appendChild(row);scroll();res();
    },delay);
  });
}

function userMsg(text){
  document.getElementById('chips-area')?.remove();
  const row=document.createElement('div');row.className='msg-row user';
  const col=document.createElement('div');col.className='msg-col';
  const bub=document.createElement('div');bub.className='bubble';bub.textContent=text;
  const ts=document.createElement('div');ts.className='msg-time';ts.textContent=timeStr();
  col.appendChild(bub);col.appendChild(ts);row.appendChild(col);area.appendChild(row);scroll();
}

function addChips(chips){
  document.getElementById('chips-area')?.remove();
  const wrap=document.createElement('div');wrap.className='qr-chips';wrap.id='chips-area';
  chips.forEach(c=>{
    const b=document.createElement('button');b.className='qr-chip';b.textContent=c.label;
    b.onclick=()=>{ wrap.remove(); userMsg(c.label); c.action(); };
    wrap.appendChild(b);
  });
  area.appendChild(wrap);scroll();
}

function appendRow(el){area.appendChild(el);scroll();}

function makeImgCard(imgKey,title,desc,links){
  const card=document.createElement('div');card.className='img-card';
  let ls=links.map(l=>`<div class="ic-link" onclick="handleLink('${l.a}')">${l.t}</div>`).join('');
  const imgSrc2 = IMAGE_MAP[imgKey];
  const art=!imgSrc2 && (CARD_ARTS[imgKey]||'');
  const ico=(!imgSrc2 && !art && ICONS[imgKey])||ICONS['welcome'];
  const imgHtml2 = imgSrc2
    ? `<img src="${imgSrc2}" width="220" height="130" loading="lazy" style="width:100%;height:130px;object-fit:cover;display:block" onerror="this.style.display='none'">`
    : (art || ico);
  card.innerHTML=`<div class="ic-img" style="background:transparent;padding:${imgSrc2?'0':art?'0':'8px'};overflow:hidden">${imgHtml2}</div>
    <div class="ic-body"><div class="ic-title">${title}</div><div class="ic-desc">${desc}</div>${ls}</div>`;
  return card;
}

function makeCaro(items){
  const wrap=document.createElement('div');wrap.className='caro-wrap';
  const inner=document.createElement('div');inner.className='caro-inner';
  items.forEach(it=>{
    const card=document.createElement('div');card.className='caro-card';
    let ls=(it.links||[]).map(l=>`<div class="caro-link" onclick="handleLink('${l.a}')">${l.t} ▶</div>`).join('');
    const imgKey = it.art||it.icon||it.img||'';
    const imgSrc = IMAGE_MAP[imgKey];
    const art = !imgSrc && (CARD_ARTS[imgKey]||'');
    const ico = !imgSrc && !art && (ICONS[imgKey]||'');
    const imgDiv = imgSrc
      ? `<div class="caro-img" style="background:#f0e8e0;padding:0;overflow:hidden"><img src="${imgSrc}" width="160" height="90" loading="lazy" style="width:100%;height:90px;object-fit:cover;display:block" onerror="this.style.display='none'"></div>`
      : art
        ? `<div class="caro-img" style="background:transparent;padding:0;overflow:hidden">${art}</div>`
        : ico
          ? `<div class="caro-img" style="background:transparent;padding:10px;display:flex;align-items:center;justify-content:center">${ico}</div>`
          : `<div class="caro-img ${it.img||''}"></div>`;
    card.innerHTML=imgDiv+`<div class="caro-body"><div class="caro-title">${it.title}</div><div class="caro-desc">${it.desc||''}</div>${ls}</div>`;
    inner.appendChild(card);
  });
  wrap.appendChild(inner);return wrap;
}

function botCard(card){
  const row=document.createElement('div');row.className='msg-row';
  row.appendChild(av());
  const col=document.createElement('div');col.className='msg-col';
  col.appendChild(card);
  const ts=document.createElement('div');ts.className='msg-time';ts.textContent=timeStr();
  col.appendChild(ts);row.appendChild(col);appendRow(row);
}

function botCaro(items){
  const wrap=makeCaro(items);appendRow(wrap);
}

}

async function ansQ3(){
  const sel=[...document.querySelectorAll('.c-chip.sel')].map(e=>e.textContent);
  const v=sel.length?sel.join('・'):'特になし';
  removeSurvey();profile.concerns=sel;userMsg(`【${v}】`);

function showQR(){
  const wrap=document.createElement('div');wrap.className='qr-wrap';
  wrap.innerHTML=`
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px">スマートフォンでご覧ください</div>
    <canvas id="qr-c" width="140" height="140" style="display:block;margin:0 auto 10px;border-radius:6px"></canvas>
    <div class="qr-note">LINEアプリを起動して、<br>QRコードを読み取ってください。<br><span style="color:var(--green);font-weight:700">https://beatle099.github.io/<br>LineHomePage/chat.html</span></div>
    <div class="lm-badge"><svg width="16" height="16" viewBox="0 0 24 24" fill="#06C755"><path d="M12 2C6.48 2 2 6.04 2 11c0 3.19 1.73 6.01 4.36 7.77L5.5 22l3.5-1.5c.93.26 1.92.4 2.95.4 5.52 0 10-4.04 10-9S17.52 2 12 2z"/></svg>Powered by L Message</div>`;
  appendRow(wrap);
  setTimeout(()=>{
    const c=document.getElementById('qr-c');if(!c)return;
    const ctx=c.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,140,140);
    ctx.fillStyle='#000';
    function csq(x,y,s){ctx.fillRect(x,y,s,s);ctx.fillStyle='#fff';ctx.fillRect(x+Math.round(s*.14),y+Math.round(s*.14),Math.round(s*.72),Math.round(s*.72));ctx.fillStyle='#000';ctx.fillRect(x+Math.round(s*.28),y+Math.round(s*.28),Math.round(s*.44),Math.round(s*.44));}
    csq(4,4,32);csq(104,4,32);csq(4,104,32);
    let s=42;function rng(){s=(s*1664525+1013904223)&0xffffffff;return(s>>>0)/4294967296;}
    for(let r=0;r<17;r++)for(let cc=0;cc<17;cc++){
      const x=6+cc*8,y=6+r*8;
      if((cc<5&&r<5)||(cc>11&&r<5)||(cc<5&&r>11))continue;
      if(rng()>.45){ctx.fillStyle='#000';ctx.fillRect(x,y,7,7);}
    }
  },200);
  setTimeout(()=>showFinalMsg(),1000);
}
