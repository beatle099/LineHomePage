<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg:        #f5f4f0;
  --surface:   #ffffff;
  --border:    rgba(0,0,0,0.09);
  --border-md: rgba(0,0,0,0.15);
  --text:      #1a1a1a;
  --muted:     #6b6b6b;
  --hint:      #9e9e9e;
  --accent:    #1a56db;
  --accent-bg: #eef3ff;
  --success:   #0a7c42;
  --success-bg:#e6f4ed;
  --danger:    #b91c1c;
  --danger-bg: #fef2f2;
  --warn:      #92400e;
  --warn-bg:   #fffbeb;
  --shadow:    0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
  --radius:    10px;
  --radius-sm: 6px;
  --font:      'Noto Sans JP', sans-serif;
  --mono:      'DM Mono', monospace;
  --transition: 0.18s ease;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #111113;
    --surface:   #1c1c1f;
    --border:    rgba(255,255,255,0.08);
    --border-md: rgba(255,255,255,0.14);
    --text:      #f0f0f0;
    --muted:     #a0a0a0;
    --hint:      #666;
    --accent:    #4f83f5;
    --accent-bg: #1a2340;
    --success:   #34d073;
    --success-bg:#0d2b1e;
    --danger:    #f87171;
    --danger-bg: #2a1414;
    --warn:      #fbbf24;
    --warn-bg:   #2a1f08;
    --shadow:    0 1px 3px rgba(0,0,0,0.4);
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── Layout ── */
.app { max-width: 760px; margin: 0 auto; padding: 2rem 1rem 4rem; }

/* ── Header ── */
.header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.75rem;
}
.header-left {}
.logo {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.logo-mark {
  width: 28px; height: 28px;
  background: var(--accent);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
}
.logo-mark svg { width: 16px; height: 16px; fill: white; }
.logo-text { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; color: var(--text); }
.tagline { font-size: 12px; color: var(--muted); }
.reset-btn {
  font-family: var(--font);
  font-size: 12px;
  color: var(--muted);
  background: none;
  border: 1px solid var(--border-md);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
  margin-top: 2px;
}
.reset-btn:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-bg); }

/* ── Summary cards ── */
.summary {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 1.75rem;
}
@media (max-width: 480px) { .summary { grid-template-columns: repeat(2, 1fr); } }
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  box-shadow: var(--shadow);
}
.stat-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.stat-val { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; line-height: 1; }
.stat-sub { font-size: 11px; color: var(--hint); margin-top: 3px; }

/* ── Overall progress bar ── */
.overall-bar-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 1.75rem;
  box-shadow: var(--shadow);
}
.overall-bar-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}
.overall-bar-label { font-size: 12px; font-weight: 500; color: var(--muted); }
.overall-bar-pct { font-size: 13px; font-weight: 700; color: var(--accent); font-family: var(--mono); }
.bar-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 99px;
  background: var(--accent);
  transition: width 0.4s cubic-bezier(.4,0,.2,1);
}

/* ── Phase accordion ── */
.phase {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: box-shadow var(--transition);
}
.phase:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.09); }

.phase-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.phase-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  transition: transform var(--transition);
}
.phase-header:hover .phase-dot { transform: scale(1.2); }

.phase-info { flex: 1; min-width: 0; }
.phase-title { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: -0.2px; }
.phase-role { font-size: 11px; color: var(--hint); margin-top: 1px; }

.phase-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.phase-count { font-size: 12px; color: var(--muted); font-family: var(--mono); }

.phase-mini-bar {
  width: 60px; height: 4px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.phase-mini-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 0.35s ease;
}

.chevron {
  width: 16px; height: 16px;
  color: var(--hint);
  flex-shrink: 0;
  transition: transform var(--transition);
}
.phase.open .chevron { transform: rotate(180deg); }

.phase-body { display: none; border-top: 1px solid var(--border); }
.phase.open .phase-body { display: block; }

/* ── Tasks ── */
.task {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background var(--transition);
}
.task:last-child { border-bottom: none; }
.task:hover { background: var(--bg); }

.checkbox {
  width: 18px; height: 18px;
  border-radius: 5px;
  border: 1.5px solid var(--border-md);
  flex-shrink: 0;
  margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
  background: var(--surface);
}
.task.done .checkbox {
  background: var(--success);
  border-color: var(--success);
}
.checkbox svg { display: none; width: 11px; height: 11px; stroke: white; stroke-width: 2.5; fill: none; }
.task.done .checkbox svg { display: block; }

.task-text {
  font-size: 13px;
  color: var(--text);
  flex: 1;
  line-height: 1.5;
  transition: color var(--transition);
}
.task.done .task-text { color: var(--hint); text-decoration: line-through; }

.badges { display: flex; gap: 5px; flex-shrink: 0; margin-top: 1px; }
.badge {
  font-size: 10px;
  font-weight: 500;
  padding: 2px 7px;
  border-radius: 99px;
  letter-spacing: 0.1px;
}
.badge-qa { background: var(--accent-bg); color: var(--accent); }
.badge-gate { background: var(--danger-bg); color: var(--danger); }

/* ── Legend ── */
.legend {
  display: flex;
  gap: 16px;
  align-items: center;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.legend-item {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; color: var(--muted);
}
.legend-dot {
  width: 8px; height: 8px; border-radius: 99px;
  flex-shrink: 0;
}

/* ── Confirm overlay ── */
.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.overlay.show { display: flex; }
.dialog {
  background: var(--surface);
  border: 1px solid var(--border-md);
  border-radius: 14px;
  padding: 24px;
  max-width: 340px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.dialog h2 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.dialog p { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }
.dialog-btns { display: flex; gap: 8px; justify-content: flex-end; }
.btn {
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-md);
  cursor: pointer;
  transition: all var(--transition);
}
.btn-cancel { background: none; color: var(--muted); }
.btn-cancel:hover { background: var(--bg); }
.btn-danger { background: var(--danger); color: white; border-color: var(--danger); }
.btn-danger:hover { opacity: 0.85; }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--text);
  color: var(--bg);
  font-size: 13px;
  padding: 10px 18px;
  border-radius: 99px;
  z-index: 200;
  transition: transform 0.3s cubic-bezier(.4,0,.2,1);
  white-space: nowrap;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ── Completion banner ── */
.complete-banner {
  display: none;
  background: var(--success-bg);
  border: 1px solid var(--success);
  border-radius: var(--radius);
  padding: 14px 18px;
  margin-bottom: 1.5rem;
  font-size: 13px;
  color: var(--success);
  font-weight: 500;
  text-align: center;
}
.complete-banner.show { display: block; }
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <div class="header-left">
      <div class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 16 16"><path d="M3 3h10v7H3zM6 10v3M10 10v3M5 13h6"/></svg>
        </div>
        <span class="logo-text">Mishona PdM</span>
      </div>
      <div class="tagline">L Message — プロダクト開発チェックリスト</div>
    </div>
    <button class="reset-btn" onclick="confirmReset()">リセット</button>
  </div>

  <div class="complete-banner" id="complete-banner">
    すべてのフェーズが完了しました。リリース準備 OK です。
  </div>

  <div class="summary">
    <div class="stat">
      <div class="stat-label">完了タスク</div>
      <div class="stat-val" id="s-done">0</div>
      <div class="stat-sub">タスク</div>
    </div>
    <div class="stat">
      <div class="stat-label">全タスク</div>
      <div class="stat-val" id="s-total">0</div>
      <div class="stat-sub">タスク</div>
    </div>
    <div class="stat">
      <div class="stat-label">QAゲート</div>
      <div class="stat-val" id="s-qa">0/0</div>
      <div class="stat-sub">通過済み</div>
    </div>
    <div class="stat">
      <div class="stat-label">進捗率</div>
      <div class="stat-val" id="s-pct">0%</div>
      <div class="stat-sub">全体</div>
    </div>
  </div>

  <div class="overall-bar-wrap">
    <div class="overall-bar-top">
      <span class="overall-bar-label">全体進捗</span>
      <span class="overall-bar-pct" id="bar-pct">0%</span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="bar-fill" style="width:0%"></div></div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div>QAチェック</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--danger)"></div>QAゲート（必須）</div>
  </div>

  <div id="phases-root"></div>

</div>

<!-- Reset confirm dialog -->
<div class="overlay" id="overlay">
  <div class="dialog">
    <h2>リセットしますか？</h2>
    <p>すべてのチェックが消去されます。この操作は元に戻せません。</p>
    <div class="dialog-btns">
      <button class="btn btn-cancel" onclick="closeOverlay()">キャンセル</button>
      <button class="btn btn-danger" onclick="doReset()">リセットする</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'mishona_pdm_v1';

const PHASES = [
  {
    id:'p1', label:'1. Discovery & planning', role:'PdM + Marketing',
    color:'#1a56db',
    tasks:[
      {t:'問題定義とユーザーペインポイントの整理', qa:false},
      {t:'Microsoft ClarityでのUX課題抽出', qa:false},
      {t:'競合調査（LINE自動化SaaS市場）', qa:false},
      {t:'ターゲットセグメントとポジショニング設計', qa:false},
      {t:'機能ブリーフ / PRD作成', qa:false},
      {t:'QAゲート — PRDチームレビュー・承認', qa:true, gate:true},
    ]
  },
  {
    id:'p2', label:'2. Design & UX', role:'PdM + UI/UXデザイナー',
    color:'#7c3aed',
    tasks:[
      {t:'Figmaでワイヤーフレーム作成', qa:false},
      {t:'ユーザーフローに沿ったワイヤーレビュー', qa:false},
      {t:'ハイファイモックアップ（Figma）制作', qa:false},
      {t:'QAゲート — UI/UXレビュー：スペース・コピー・アクセシビリティ', qa:true, gate:true},
      {t:'ステージング確認チェックリスト準備', qa:false},
      {t:'ステークホルダーによる最終デザイン承認', qa:false},
      {t:'QAゲート — 開発ハンドオフ前のデザイン承認', qa:true, gate:true},
    ]
  },
  {
    id:'p3', label:'3. Development', role:'PdM + 開発チーム',
    color:'#0f766e',
    tasks:[
      {t:'PRDを開発タスク（チケット）に分解', qa:false},
      {t:'スプリントスケジュールとタイムライン設定', qa:false},
      {t:'タスクボード管理・開発ブロック解消', qa:false},
      {t:'ステージング環境へのデプロイ確認', qa:false},
      {t:'QAゲート — ステージングスモークテスト', qa:true, gate:true},
      {t:'前リリースからのリグレッション確認', qa:false},
      {t:'QAゲート — クリティカルバグなし・閾値以下', qa:true, gate:true},
    ]
  },
  {
    id:'p4', label:'4. Quality assurance', role:'PdM + QA / CSチーム',
    color:'#b91c1c',
    tasks:[
      {t:'新機能ごとのテストケース作成', qa:false},
      {t:'機能テスト — 全ユーザーフロー合格', qa:true},
      {t:'エッジケース・エラー状態のテスト', qa:true},
      {t:'モバイルレスポンシブ確認', qa:true},
      {t:'クロスブラウザ互換性テスト', qa:true},
      {t:'Clarityヒートマップ・セッション録画でUX確認', qa:false},
      {t:'CSチームによる実ユーザー問い合わせシミュレーション', qa:false},
      {t:'QAゲート — 全テストケース合格・サインオフ取得', qa:true, gate:true},
    ]
  },
  {
    id:'p5', label:'5. Release & go-to-market', role:'PdM + Marketing + CS',
    color:'#c2410c',
    tasks:[
      {t:'リリースノート・内部変更履歴の作成', qa:false},
      {t:'CSサポート資料（ドキュメント・動画）準備', qa:false},
      {t:'CVR関連変更のLPアップデート', qa:false},
      {t:'既存ユーザー向けLINE配信文の作成', qa:false},
      {t:'QAゲート — LPプレビュー・LINE配信文プレビュー確認', qa:true, gate:true},
      {t:'本番環境へのデプロイ', qa:false},
      {t:'リリース後48時間のClarity・KPI監視', qa:false},
    ]
  },
  {
    id:'p6', label:'6. Post-release review', role:'PdM + 全チーム',
    color:'#4b5563',
    tasks:[
      {t:'CS・LINEチャットからのユーザーフィードバック収集', qa:false},
      {t:'KPIレビュー：登録数・CVR・サポート量', qa:false},
      {t:'次スプリント用バグ・改善アイデアの記録', qa:false},
      {t:'振り返り — うまくいったこと・改善点の整理', qa:false},
      {t:'QAゲート — 振り返りレポート作成・共有完了', qa:true, gate:true},
    ]
  }
];

// ── State ──
let state = {};

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) state = JSON.parse(saved);
  } catch(e) {}
  PHASES.forEach(p => p.tasks.forEach((_,i) => {
    const k = p.id+'_'+i;
    if (!(k in state)) state[k] = false;
  }));
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

// ── Render ──
function buildPhases() {
  const root = document.getElementById('phases-root');
  root.innerHTML = '';
  PHASES.forEach((p, pi) => {
    const el = document.createElement('div');
    el.className = 'phase';
    el.id = 'phase-'+p.id;

    const tasksHTML = p.tasks.map((task,i) => {
      const k = p.id+'_'+i;
      const done = state[k];
      let badges = '';
      if (task.gate) badges = '<div class="badges"><span class="badge badge-gate">QAゲート</span></div>';
      else if (task.qa) badges = '<div class="badges"><span class="badge badge-qa">QA</span></div>';
      return `<div class="task${done?' done':''}" onclick="toggle('${p.id}',${i})" data-key="${k}">
        <div class="checkbox"><svg viewBox="0 0 12 10"><polyline points="1,5 4.5,9 11,1"/></svg></div>
        <div class="task-text">${task.t}</div>
        ${badges}
      </div>`;
    }).join('');

    el.innerHTML = `
      <div class="phase-header" onclick="togglePhase('${p.id}')">
        <div class="phase-dot" style="background:${p.color}"></div>
        <div class="phase-info">
          <div class="phase-title">${p.label}</div>
          <div class="phase-role">${p.role}</div>
        </div>
        <div class="phase-right">
          <span class="phase-count" id="cnt-${p.id}">0/${p.tasks.length}</span>
          <div class="phase-mini-bar">
            <div class="phase-mini-fill" id="mini-${p.id}" style="width:0%;background:${p.color}"></div>
          </div>
          <svg class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="4,6 8,10 12,6"/>
          </svg>
        </div>
      </div>
      <div class="phase-body">${tasksHTML}</div>`;
    root.appendChild(el);

    // open first incomplete phase by default
    if (pi === 0) el.classList.add('open');
  });
}

function updateStats() {
  let totalDone=0, total=0, qaDone=0, qaTotal=0;
  PHASES.forEach(p => {
    let pDone=0;
    p.tasks.forEach((task,i) => {
      total++;
      const done = state[p.id+'_'+i];
      if (done) { totalDone++; pDone++; }
      if (task.gate) { qaTotal++; if (done) qaDone++; }
    });
    const pct = p.tasks.length ? Math.round(pDone/p.tasks.length*100) : 0;
    const cntEl = document.getElementById('cnt-'+p.id);
    const miniEl = document.getElementById('mini-'+p.id);
    if (cntEl) cntEl.textContent = pDone+'/'+p.tasks.length;
    if (miniEl) miniEl.style.width = pct+'%';
  });
  const pct = total ? Math.round(totalDone/total*100) : 0;
  document.getElementById('s-done').textContent = totalDone;
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-qa').textContent = qaDone+'/'+qaTotal;
  document.getElementById('s-pct').textContent = pct+'%';
  document.getElementById('bar-fill').style.width = pct+'%';
  document.getElementById('bar-pct').textContent = pct+'%';
  document.getElementById('complete-banner').classList.toggle('show', pct===100);
}

function refreshTaskUI(phaseId, idx) {
  const k = phaseId+'_'+idx;
  const taskEl = document.querySelector(`[data-key="${k}"]`);
  if (!taskEl) return;
  taskEl.classList.toggle('done', state[k]);
}

// ── Actions ──
function toggle(phaseId, idx) {
  const k = phaseId+'_'+idx;
  state[k] = !state[k];
  saveState();
  refreshTaskUI(phaseId, idx);
  updateStats();

  // Clarity custom event
  if (typeof clarity !== 'undefined') {
    const phase = PHASES.find(p => p.id === phaseId);
    const task = phase && phase.tasks[idx];
    if (task && task.gate && state[k]) {
      clarity('set', 'qa_gate_passed', phase.label);
    }
  }
}

function togglePhase(id) {
  const el = document.getElementById('phase-'+id);
  if (el) el.classList.toggle('open');
}

function confirmReset() {
  document.getElementById('overlay').classList.add('show');
}
function closeOverlay() {
  document.getElementById('overlay').classList.remove('show');
}
function doReset() {
  PHASES.forEach(p => p.tasks.forEach((_,i) => { state[p.id+'_'+i] = false; }));
  saveState();
  buildPhases();
  updateStats();
  closeOverlay();
  showToast('リセットしました');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Init ──
loadState();
buildPhases();
updateStats();
</script>
</body>
</html>
